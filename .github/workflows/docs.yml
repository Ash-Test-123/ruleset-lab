name: docs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: How the bot commit is made
        type: choice
        options: [api, git, none, prod]
        default: api
      author:
        description: Commit author in git mode
        type: choice
        options: [actions, app]
        default: actions
      merge:
        description: Merge the pull request after updating it
        type: boolean
        default: true

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LAB_APP_ID }}
          private-key: ${{ secrets.LAB_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Generate file
        run: date -u +%Y-%m-%dT%H:%M:%SZ > generated.txt

      - name: Commit with git
        if: inputs.mode == 'git'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: bot/docs
          AUTHOR: ${{ inputs.author }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ "$AUTHOR" = app ]; then
            id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git checkout -B "$BRANCH"
          git add generated.txt
          git commit -m "Update generated file"
          git push --force origin "$BRANCH"

      # Commits made through the API with the app's token are signed by GitHub
      # and authored by the app.
      - name: Commit through the API
        if: inputs.mode == 'api'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: bot/docs
          FILE: generated.txt
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$base" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" >/dev/null
          fi

          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$BRANCH" --jq .sha 2>/dev/null || true)
          jq -n --arg branch "$BRANCH" --arg sha "$current" --rawfile content <(base64 -w0 "$FILE") \
            '{message: "Update generated file", branch: $branch, content: $content}
             + (if $sha == "" then {} else {sha: $sha} end)' \
            | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" --input - --jq '"commit \(.commit.sha)"'

      # Same commands as the production docs step; only repo, base branch and file differ.
      - name: Production mirror
        if: inputs.mode == 'prod'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: bot/docs
        run: |
          base=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$base" -F force=true >/dev/null 2>&1 \
            || gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" >/dev/null

          jq -n --arg branch "$BRANCH" \
            --arg sha "$(gh api "repos/$REPO/contents/generated.txt?ref=$BRANCH" --jq .sha)" \
            --arg message "$(printf 'Update generated file\n\nSource commit: %s' "$GITHUB_SHA")" \
            --rawfile content <(base64 -w0 generated.txt) \
            '{message: $message, branch: $branch, sha: $sha, content: $content}' \
            | gh api -X PUT "repos/$REPO/contents/generated.txt" --input - >/dev/null

          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "open PR after commit: ${pr:-none}"
          if [ -z "$pr" ]; then
            url=$(gh pr create --title "Update generated file" --body "Automated update." --head "$BRANCH" --base main)
            pr=${url##*/}
          fi
          echo "merging PR #$pr"

          for attempt in 1 2 3 4 5 6; do
            sleep 5
            state=$(gh pr view "$pr" --json mergeable --jq .mergeable)
            echo "attempt $attempt: mergeable=$state"
            [ "$state" = MERGEABLE ] || continue
            gh pr merge "$pr" --squash --admin && exit 0
          done
          exit 1

      - name: Open and merge pull request
        if: inputs.mode != 'prod'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: bot/docs
          MERGE: ${{ inputs.merge }}
        run: |
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "Update generated file" --body "Automated update." --head "$BRANCH" --base main
          fi
          if [ "$MERGE" = true ]; then
            gh pr merge "$BRANCH" --squash --admin
          fi
